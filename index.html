<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Tontine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ECRAN DE CONNEXION OU ADHÉSION -->
  <div id="auth-screen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
      <!-- Onglets d'authentification -->
      <div class="flex border-b mb-6">
        <button id="tab-login-btn" class="w-1/2 py-2 text-center font-bold text-amber-600 border-b-2 border-amber-600">Connexion</button>
        <button id="tab-signup-btn" class="w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent">Adhésion (Créer un compte)</button>
      </div>

      <!-- Formulaire Connexion -->
      <div id="form-login-box" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Email</label>
          <input id="login-email" type="email" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Mot de passe</label>
          <input id="login-pass" type="password" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <button id="btn-login" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2 rounded-lg text-sm transition">Se Connecter</button>
      </div>

      <!-- Formulaire Adhésion (Inscription) -->
      <div id="form-signup-box" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold mb-1">Adresse Email</label>
          <input id="signup-email" type="email" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Créer un mot de passe</label>
          <input id="signup-pass" type="password" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Confirmer le mot de passe</label>
          <input id="signup-confirm-pass" type="password" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <button id="btn-signup" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition">Créer mon compte</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION PRINCIPALE -->
  <div id="app-screen" class="hidden">
    <header class="bg-amber-700 text-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Gestion Tontine</h1>
        <button id="btn-logout" class="bg-amber-800 hover:bg-amber-900 px-3 py-1 rounded text-xs">Déconnexion</button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <nav class="flex gap-2 border-b mb-6 overflow-x-auto pb-2">
        <button class="nav-tab px-4 py-2 text-sm font-semibold text-amber-600 border-b-2 border-amber-600" data-target="sec-membres">Membres</button>
        <button class="nav-tab px-4 py-2 text-sm font-semibold text-slate-500" data-target="sec-cotisations">Cotisations</button>
        <button class="nav-tab px-4 py-2 text-sm font-semibold text-slate-500" data-target="sec-calendrier">Calendrier</button>
        <button class="nav-tab px-4 py-2 text-sm font-semibold text-slate-500" data-target="sec-commissions">Commissions</button>
        <button class="nav-tab px-4 py-2 text-sm font-semibold text-slate-500" data-target="sec-situation">Situation Caisse</button>
      </nav>

      <!-- SECTIONS (MEMBRES, COTISATIONS, SITUATION...) -->
      <section id="sec-membres" class="tab-content">
        <div class="bg-white p-4 rounded-xl shadow-sm border mb-6">
          <h3 class="font-bold text-amber-700 mb-3">Ajouter / Modifier un Membre</h3>
          <form id="form-membre" class="grid grid-cols-1 md:grid-cols-5 gap-3">
            <input id="m-carnet" placeholder="N° Carnet" required class="border rounded p-2 text-sm">
            <input id="m-nom" placeholder="Nom" required class="border rounded p-2 text-sm">
            <input id="m-prenom" placeholder="Prénoms" required class="border rounded p-2 text-sm">
            <input id="m-tel" placeholder="Téléphone" required class="border rounded p-2 text-sm">
            <input id="m-mise" type="number" placeholder="Mise (FCFA)" required class="border rounded p-2 text-sm">
            <button type="submit" class="md:col-span-5 bg-amber-600 text-white font-medium py-2 rounded text-sm hover:bg-amber-700">Sauvegarder le membre</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyA0ZgNpNhMA5eVMcGFAJXsvgIQIZ1h6Pi4",
    authDomain: "tontineapp-9f724.firebaseapp.com",
    databaseURL: "https://tontineapp-9f724-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tontineapp-9f724",
    storageBucket: "tontineapp-9f724.firebasestorage.app",
    messagingSenderId: "21158711906",
    appId: "1:21158711906:web:4489eb84cfb320c7d9f73b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Gestion du basculement entre Connexion et Adhésion
    const tabLogin = document.getElementById('tab-login-btn');
    const tabSignup = document.getElementById('tab-signup-btn');
    const formLogin = document.getElementById('form-login-box');
    const formSignup = document.getElementById('form-signup-box');

    tabLogin.addEventListener('click', () => {
      tabLogin.className = "w-1/2 py-2 text-center font-bold text-amber-600 border-b-2 border-amber-600";
      tabSignup.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent";
      formLogin.classList.remove('hidden');
      formSignup.classList.add('hidden');
    });

    tabSignup.addEventListener('click', () => {
      tabSignup.className = "w-1/2 py-2 text-center font-bold text-emerald-600 border-b-2 border-emerald-600";
      tabLogin.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent";
      formSignup.classList.remove('hidden');
      formLogin.classList.add('hidden');
    });

    // Action : Connexion
    document.getElementById('btn-login').addEventListener('click', () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Erreur de connexion : " + err.message));
    });

    // Action : Adhésion (Créer un compte)
    document.getElementById('btn-signup').addEventListener('click', () => {
      const email = document.getElementById('signup-email').value;
      const pass = document.getElementById('signup-pass').value;
      const confirmPass = document.getElementById('signup-confirm-pass').value;

      if (pass !== confirmPass) {
        alert("Les mots de passe ne correspondent pas !");
        return;
      }

      auth.createUserWithEmailAndPassword(email, pass)
        .then(() => alert("Compte créé avec succès ! Bienvenue."))
        .catch(err => alert("Erreur d'adhésion : " + err.message));
    });

    // Déconnexion
    document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());

    // Suivi de session de l'utilisateur
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
