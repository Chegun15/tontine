<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Tontine Pro</title>
  <!-- Frameworks CSS et Icônes -->
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen w-full bg-slate-50">

  <!-- SCREEN 1 : AUTHENTIFICATION -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-amber-800 to-amber-600">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md fade-in">
      <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-gray-800">Tontine Securis</h2>
        <p class="text-gray-500 mt-1" id="auth-subtitle">Connectez-vous à votre espace Collecteur</p>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Adresse Email</label>
          <input id="auth-email" type="email" placeholder="agent@tontine.com" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Mot de passe</label>
          <input id="auth-password" type="password" placeholder="••••••••" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-500">
        </div>
        
        <button id="btn-primary-auth" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-3 rounded-xl transition text-sm">Se connecter</button>
        
        <div class="text-center mt-4">
          <button id="btn-toggle-auth" class="text-sm text-amber-700 hover:underline">Pas de compte ? Créer un espace Agent</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2 : INTERFACE PRINCIPALE -->
  <div id="app-screen" class="hidden fade-in">
    <header class="bg-gradient-to-r from-amber-900 to-amber-700 text-white shadow-md">
     <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold md:text-2xl">Gestion Tontine</h1>
        <p id="user-display-email" class="text-xs text-amber-200"></p>
      </div>
      <button id="btn-logout" class="bg-amber-800 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
        <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Déconnexion
      </button>
     </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
     
     <!-- SITUATION JOURNALIÈRE -->
     <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">
       <div class="flex items-center justify-between mb-3">
         <h3 class="text-sm font-bold uppercase tracking-wider text-gray-700 flex items-center gap-1">
           <i data-lucide="calendar-check" class="text-amber-600 w-4 h-4"></i> Situation Journalière
         </h3>
         <span id="live-date" class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded font-medium"></span>
       </div>
       <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
         <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl">
           <span class="text-[11px] uppercase font-bold text-emerald-700">Entrées du jour</span>
           <p id="day-in" class="text-xl font-bold text-emerald-900">0 FCFA</p>
         </div>
         <div class="bg-rose-50 border border-rose-100 p-3 rounded-xl">
           <span class="text-[11px] uppercase font-bold text-rose-700">Sorties du jour</span>
           <p id="day-out" class="text-xl font-bold text-rose-900">0 FCFA</p>
         </div>
         <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl">
           <span class="text-[11px] uppercase font-bold text-amber-700">Solde du jour</span>
           <p id="day-solde" class="text-xl font-bold text-amber-900">0 FCFA</p>
         </div>
       </div>
     </div>

     <!-- NAVIGATION -->
     <nav class="flex gap-1 border-b border-gray-200 mb-6 overflow-x-auto" role="tablist">
      <button class="tab-btn tab-active px-4 py-2.5 text-sm whitespace-nowrap flex items-center gap-1" data-tab="membres">
        <i data-lucide="users" class="w-4 h-4"></i>Membres
      </button> 
      <button class="tab-btn px-4 py-2.5 text-sm whitespace-nowrap flex items-center gap-1" data-tab="cotisations">
        <i data-lucide="wallet" class="w-4 h-4"></i>Mouvements
      </button> 
     </nav>

     <!-- ONGLET MEMBRES -->
     <section id="tab-membres" class="fade-in">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">
        <div class="flex flex-wrap gap-3 items-end">
         <div class="flex-1 min-w-[90px]">
           <label class="block text-xs font-medium text-gray-600 mb-1">N° Carnet</label>
           <input id="inp-carnet" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none">
         </div>
         <div class="flex-1 min-w-[150px]">
           <label class="block text-xs font-medium text-gray-600 mb-1">Nom & Prénoms</label>
           <input id="inp-nom" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none">
         </div>
         <div class="flex-1 min-w-[110px]">
           <label class="block text-xs font-medium text-gray-600 mb-1">Mise (FCFA)</label>
           <input id="inp-mise" type="number" min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none">
         </div>
         <button id="btn-add-membre" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2 rounded-lg text-sm font-medium h-[38px] transition">＋ Ajouter</button>
        </div>
      </div>

      <div class="overflow-x-auto rounded-xl shadow-sm border border-gray-100 bg-white">
       <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-700 border-b border-gray-100">
         <tr>
          <th class="px-4 py-3 text-left font-semibold">Carnet</th>
          <th class="px-4 py-3 text-left font-semibold">Nom & Prénoms</th>
          <th class="px-4 py-3 text-right font-semibold">Mise</th>
          <th class="px-4 py-3 text-right font-semibold">Total Cotisé</th>
          <th class="px-4 py-3 text-right font-semibold">Total Tiré</th>
          <th class="px-4 py-3 text-right font-semibold">Solde Permanent</th>
         </tr>
        </thead>
        <tbody id="membres-tbody" class="divide-y divide-gray-100"></tbody>
       </table>
      </div>
     </section>

     <!-- ONGLET MOUVEMENTS -->
     <section id="tab-cotisations" class="hidden fade-in grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
          <h3 class="text-md font-semibold text-emerald-700 mb-3 flex items-center gap-1"><i data-lucide="arrow-down-circle"></i> Encaisser Cotisation</h3>
          <div class="space-y-3">
            <select id="select-cotis" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none"></select>
            <input id="inp-cotis-mult" type="number" value="1" min="1" placeholder="Nombre de mises" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none">
            <button id="btn-save-cotis" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium transition">Valider l'encaissement</button>
          </div>
        </div>

        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
          <h3 class="text-md font-semibold text-rose-700 mb-3 flex items-center gap-1"><i data-lucide="arrow-up-circle"></i> Décaisser Paiement</h3>
          <div class="space-y-3">
            <select id="select-retrait" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none"></select>
            <input id="inp-retrait-val" type="number" min="0" placeholder="Montant (FCFA)" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none">
            <button id="btn-save-retrait" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg text-sm font-medium transition">Valider le décaissement</button>
          </div>
        </div>
     </section>

    </main>
  </div>

  <!-- Chargement des scripts JS -->
  <script type="module" src="script.js"></script>
</body>
</html>
